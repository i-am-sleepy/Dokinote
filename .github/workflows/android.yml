name: Android CI

on:
  push:
    branches: [main, 'track/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Office track (additive): unpack the pinned LibreOffice Viewer libs/assets into office-app (see office-app/lok-apk.lock).
      - name: Fetch LibreOffice engine for office-app
        if: hashFiles('office-app/lok-apk.lock') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          tools/fetch_lok_apk.sh 2>&1 | tee build.log

      - name: Build debug APKs
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee -a build.log

      - name: Publish dev APKs to a per-branch pre-release
        if: github.event_name != 'pull_request' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          BR="${GITHUB_REF_NAME}"
          TAG="nightly-${BR//\//-}"
          cp "$(ls pdf-app/build/outputs/apk/debug/*.apk | head -1)" Dokinote-pdf-dev.apk
          cp "$(ls office-app/build/outputs/apk/debug/*.apk | head -1)" Dokinote-office-dev.apk
          case "$BR" in
            track/pdf-notes) FILES="Dokinote-pdf-dev.apk" ;;
            track/office)    FILES="Dokinote-office-dev.apk" ;;
            *)               FILES="Dokinote-pdf-dev.apk Dokinote-office-dev.apk" ;;
          esac
          NOTES="Dev build of ${GITHUB_SHA::7} on ${BR} ($(date -u +'%Y-%m-%d %H:%M UTC')). Debug build signed with the public dev key; installs over the previous build."
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Dev build: ${BR}" --notes "$NOTES"
          gh release upload "$TAG" $FILES --clobber
          gh release edit "$TAG" --notes "$NOTES"

      - name: Publish build log to branch ci-log-<branch> (readable without a PC)
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          LOGB="ci-log-${GITHUB_REF_NAME//\//-}"
          mkdir -p /tmp/logrepo && cd /tmp/logrepo
          git init -q -b "$LOGB"
          {
            echo "run: ${GITHUB_RUN_ID}  branch: ${GITHUB_REF_NAME}  sha: ${GITHUB_SHA}  status: ${{ job.status }}"
            echo "-----"
            tail -n 400 "${GITHUB_WORKSPACE}/build.log" 2>/dev/null || echo "(no build.log)"
          } > latest.txt
          git add latest.txt
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "ci log ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$LOGB"
