name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log

      - name: Publish APK to the rolling "nightly" pre-release
        if: github.ref == 'refs/heads/main' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Dokinote-dev.apk
          NOTES="Rolling dev build of ${GITHUB_SHA::7} ($(date -u +'%Y-%m-%d %H:%M UTC')). Debug build signed with the public dev key; installs over the previous nightly."
          gh release view nightly >/dev/null 2>&1 || gh release create nightly --prerelease --title "Nightly dev build" --notes "$NOTES"
          gh release upload nightly Dokinote-dev.apk --clobber
          gh release edit nightly --notes "$NOTES"

      - name: Publish build log to branch ci-logs (so failures are readable without a PC)
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logrepo && cd /tmp/logrepo
          git init -q -b ci-logs
          {
            echo "run: ${GITHUB_RUN_ID}  sha: ${GITHUB_SHA}  status: ${{ job.status }}"
            echo "-----"
            tail -n 400 "${GITHUB_WORKSPACE}/build.log" 2>/dev/null || echo "(no build.log)"
          } > latest.txt
          git add latest.txt
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "ci log ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
